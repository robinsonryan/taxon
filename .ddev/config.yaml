name: taxon
type: php
docroot: ""
php_version: "8.5"
webserver_type: nginx-fpm
database:
  type: postgres
  version: "18"
nodejs_version: "22"

hooks:
  post-start:
    - exec: composer install
    # The Pest suite runs against real Postgres — SQLite's loose type affinity
    # cannot see a column-type mismatch — on a database of its own.
    - exec: psql -h db -U db -d db -tc "SELECT 1 FROM pg_database WHERE datname = 'testing'" | grep -q 1 || psql -h db -U db -d db -c "CREATE DATABASE testing"
